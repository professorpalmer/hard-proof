[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hardproof"
version = "0.2.0"
description = "A proof gate for one Python function (Lean 4), and an audit ladder that takes review findings to fixes."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cary Palmer" }]
dependencies = []
keywords = ["lean4", "formal-verification", "code-review", "ai-agents"]

[project.urls]
Homepage = "https://puppetmaster.gg/labs/hard-proof/"
Repository = "https://github.com/professorpalmer/hard-proof"

[project.scripts]
hardproof = "hardproof.cli:main"
hp = "hardproof.cli:main"
hpflow = "hpflow.cli:main"
hpf = "hpflow.cli:main"

[tool.setuptools]
packages = ["hardproof", "hpflow"]
