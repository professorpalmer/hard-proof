[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpflow"
version = "0.5.0"
description = "A proof gate for one Python function (Lean 4), and an audit ladder that takes review findings to fixes with the agent command line you have (Claude Code, Codex, or any other)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Cary Palmer" }]
dependencies = []
keywords = ["lean4", "formal-verification", "code-review", "ai-agents", "release-gate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://puppetmaster.gg/labs/hard-proof/"
Repository = "https://github.com/professorpalmer/hard-proof"
Paper = "https://puppetmaster.gg/labs/hard-proof/paper/"

[project.scripts]
hp = "hpflow.proof.cli:main"
hpflow = "hpflow.cli:main"
hpf = "hpflow.cli:main"

[tool.setuptools]
packages = ["hpflow", "hpflow.proof"]
